# —— 服务端口（可选）——
# server:
#   port: 8080

# —— 环境切换 ——
# 当前默认 cloud（云端 DeepSeek）；切回本地 LM Studio 时把下面改回 local，
# 或在 IDEA 运行配置的 Active profiles 里填 local/cloud 临时覆盖。
spring:
  profiles:
    active: cloud
  # —— PostgreSQL + pgvector（对应正在运行的 rag_pgvector 容器）——
  datasource:
    url: jdbc:postgresql://localhost:5432/rag_db
    username: postgres
    password: "123456"
    driver-class-name: org.postgresql.Driver

# —— cloudMall 业务库（MySQL，只读查询，不影响主数据源自动配置）——
cloudmall:
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

# —— 向量化模型（阿里云百炼，两个环境共用，key 从环境变量注入）——
# 设置（PowerShell，只需执行一次）：setx DASHSCOPE_API_KEY "你的百炼key"
rag:
  embedding:
    base-url: https://dashscope.aliyuncs.com
    api-key: ${DASHSCOPE_API_KEY:}
    model: text-embedding-v4
    dimension: 1536       # 已随请求传给百炼；text-embedding-v4 默认 1024，不显式传则维度不符
  retrieval:
    top-k: 3              # 最终送入 LLM 的分块条数
    candidate-limit: 20   # 送 Rerank 精排的候选池大小（必须 ≥ top-k）
    evidence-threshold: 0.48  # 证据闸门：rerank top1 相关性低于此值按无证据拒答（标定：11 正例最低 0.680、4 负例最高 0.276 的中点）
    bm25-enabled: true    # BM25 关键词召回开关（已验证修复，向量+BM25 融合）
    rrf-k: 60             # RRF 融合平滑常数（k 越大排名差影响越小，行业经验值 60）
  rerank:
    enabled: true         # 关闭时 NoopRerankClient 原样透传；开启时调百炼 qwen3-rerank
    model: qwen3-rerank
    base-url: https://dashscope.aliyuncs.com
    api-key: ${DASHSCOPE_API_KEY:}

  # —— 记忆系统（工作记忆按会话落库，上下文由服务端按预算装配）——
  memory:
    recent-turns: 8             # 上下文最多注入的对话轮数
    max-context-chars: 3000     # 上下文字符预算，超出丢弃更早的消息
    summary-trigger-messages: 16 # 未摘要消息超过该条数触发压缩
    summary-keep-turns: 4       # 压缩时保留最近几轮原文
