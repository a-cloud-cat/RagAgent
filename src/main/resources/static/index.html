<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f4f5f7;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #2563eb;
            color: #fff;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .doc-btn {
            background: rgba(255,255,255,.18);
            color: #fff;
            border: 1px solid rgba(255,255,255,.4);
            border-radius: 6px;
            padding: 5px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .doc-btn:hover { background: rgba(255,255,255,.28); }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg { display: flex; max-width: 80%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .user-col { display: flex; flex-direction: column; align-items: flex-end; }
        .msg-actions { display: flex; gap: 12px; margin-top: 4px; }
        .msg-btn {
            font-size: 12px;
            color: #6b7280;
            background: none;
            border: none;
            padding: 2px;
            cursor: pointer;
        }
        .msg-btn:hover { color: #2563eb; }
        .edit-input {
            width: 320px;
            max-width: 70vw;
            border: 1px solid #2563eb;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.7;
            resize: vertical;
            outline: none;
        }
        .bubble {
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
        .msg.ai .bubble { background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 2px; }
        details.reasoning {
            margin-bottom: 8px;
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            padding: 6px 10px;
        }
        details.reasoning summary {
            cursor: pointer;
            color: #6b7280;
            font-size: 13px;
            user-select: none;
        }
        details.reasoning .rtext {
            margin-top: 6px;
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .cursor { display: inline-block; width: 7px; height: 15px; background: #2563eb; animation: blink 1s steps(1) infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
        #input-bar {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }
        #question {
            flex: 1;
            resize: none;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            height: 44px;
            max-height: 140px;
            outline: none;
        }
        #question:focus { border-color: #2563eb; }
        #send {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 15px;
            cursor: pointer;
            height: 44px;
        }
        #send:disabled { background: #9ca3af; cursor: not-allowed; }
        #send.stopping { background: #fff; color: #dc2626; border: 1px solid #dc2626; }
        .stop-mark {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #dc2626;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px;
        }
        .hint { text-align: center; color: #9ca3af; font-size: 13px; margin-top: 30px; }
        .degraded-banner {
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #c2410c;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .msg-meta {
            margin-top: 10px;
            padding-top: 6px;
            border-top: 1px dashed #e5e7eb;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.6;
        }
        /* 未调用模型（闸门拒答/中止）时不留空的分隔线 */
        .msg-meta:empty { display: none; }
        details.sources {
            margin-top: 10px;
            border-top: 1px dashed #e5e7eb;
            padding-top: 8px;
            font-size: 13px;
        }
        details.sources summary {
            cursor: pointer;
            color: #2563eb;
            user-select: none;
        }
        .source-item {
            margin-top: 8px;
            padding: 8px 10px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
        }
        .source-head { color: #374151; font-weight: 500; margin-bottom: 4px; }
        .source-text {
            color: #6b7280;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            /* 默认只露前两行，点开看全文，避免来源面板把对话淹没 */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .source-item.expanded .source-text { display: block; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.show { display: flex; }
        .modal-dialog {
            background: #fff;
            border-radius: 12px;
            padding: 22px 24px 18px;
            width: 380px;
            max-width: calc(100vw - 40px);
            box-shadow: 0 12px 40px rgba(0,0,0,.2);
        }
        .modal-title { font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 10px; }
        .modal-text { font-size: 14px; color: #4b5563; line-height: 1.7; margin-bottom: 20px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button {
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 14px;
            cursor: pointer;
        }
        #modal-cancel { background: #f3f4f6; color: #374151; }
        #modal-ok { background: #2563eb; color: #fff; }
        .doc-modal-dialog { width: 640px; max-width: calc(100vw - 40px); }
        .doc-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .doc-modal-title { font-size: 16px; font-weight: 600; color: #1f2937; }
        .doc-refresh { background: #f3f4f6; color: #374151; border: none; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
        .doc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .doc-table th, .doc-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .doc-table th { color: #6b7280; font-weight: 500; font-size: 13px; background: #f9fafb; }
        .doc-table td { color: #1f2937; }
        .doc-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .doc-status.INGESTED { background: #dcfce7; color: #166534; }
        .doc-status.FAILED { background: #fee2e2; color: #991b1b; }
        .doc-status.PENDING { background: #fef3c7; color: #92400e; }
        .doc-empty { text-align: center; color: #9ca3af; padding: 30px 0; font-size: 14px; }
        .doc-del-btn { background: #fee2e2; color: #b91c1c; border: none; border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
        .doc-del-btn:hover { background: #fecaca; }
        .doc-restore-btn { background: #dbeafe; color: #1d4ed8; border: none; border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
        .doc-restore-btn:hover { background: #bfdbfe; }
        .doc-bin-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; cursor: pointer; }
    </style>
</head>
<body>
<header><span>RAG 智能助手</span><button id="doc-manage-btn" class="doc-btn">文档</button></header>
<div id="messages">
    <div class="hint">在下方输入问题开始对话（接口 POST /chat，SSE 流式返回）</div>
</div>
<div id="kb-status" class="degraded-banner" style="display:none; margin:0 20px 8px;">知识库未连接，当前回答将不基于资料</div>
<div id="input-bar">
    <textarea id="question" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
</div>

<div id="confirm-modal" class="modal-overlay">
    <div class="modal-dialog">
        <div class="modal-title">知识库未连接</div>
        <div id="modal-text" class="modal-text"></div>
        <div class="modal-actions">
            <button id="modal-cancel">取消</button>
            <button id="modal-ok">直接使用大模型</button>
        </div>
    </div>
</div>

<div id="doc-modal" class="modal-overlay">
    <div class="modal-dialog doc-modal-dialog">
        <div class="doc-modal-head">
            <div class="doc-modal-title">文档列表</div>
            <div style="display:flex; align-items:center; gap:14px;">
                <label class="doc-bin-toggle"><input type="checkbox" id="doc-bin-check"> 回收站</label>
                <button id="doc-refresh-btn" class="doc-refresh">刷新</button>
            </div>
        </div>
        <div id="doc-list-body"></div>
        <div class="modal-actions">
            <button id="doc-close-btn">关闭</button>
        </div>
    </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('question');
    const sendBtn = document.getElementById('send');
    const kbStatusEl = document.getElementById('kb-status');
    const modalEl = document.getElementById('confirm-modal');
    const modalTextEl = document.getElementById('modal-text');
    const modalOkBtn = document.getElementById('modal-ok');
    const modalCancelBtn = document.getElementById('modal-cancel');
    const docManageBtn = document.getElementById('doc-manage-btn');
    const docModal = document.getElementById('doc-modal');
    const docListBody = document.getElementById('doc-list-body');
    const docRefreshBtn = document.getElementById('doc-refresh-btn');
    const docCloseBtn = document.getElementById('doc-close-btn');
    const docBinCheck = document.getElementById('doc-bin-check');
    let busy = false;

    // Promise 化的居中确认框：resolve(true)=确认降级，resolve(false)=取消发送
    function confirmModal(text) {
        return new Promise((resolve) => {
            modalTextEl.textContent = text;
            modalEl.classList.add('show');
            modalOkBtn.focus();

            function cleanup(result) {
                modalEl.classList.remove('show');
                modalOkBtn.onclick = null;
                modalCancelBtn.onclick = null;
                document.onkeydown = null;
                resolve(result);
            }
            modalOkBtn.onclick = () => cleanup(true);
            modalCancelBtn.onclick = () => cleanup(false);
            document.onkeydown = (e) => {
                if (e.key === 'Escape') cleanup(false);
                if (e.key === 'Enter') cleanup(true);
            };
        });
    }
    // 会话内"已知晓知识库不可用"的确认状态；知识库恢复后重置，不做永久放行
    let degradedConfirmed = false;
    // 计费口径（当前峰谷时段与单价），后端未启用时为 null
    let pricingInfo = null;
    // 当前进行中请求的取消句柄，空闲为 null；供终止按钮跨事件访问
    let currentAbort = null;

    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!busy) send();
        }
    });
    // 同一按钮两态：生成中点击终止，空闲点击发送
    sendBtn.addEventListener('click', () => {
        if (busy) currentAbort && currentAbort.abort();
        else send();
    });

    docManageBtn.addEventListener('click', () => { docBinCheck.checked = false; docModal.classList.add('show'); loadDocuments(false); });
    docCloseBtn.addEventListener('click', () => docModal.classList.remove('show'));
    docRefreshBtn.addEventListener('click', () => loadDocuments(docBinCheck.checked));
    docBinCheck.addEventListener('change', () => loadDocuments(docBinCheck.checked));
    docModal.addEventListener('click', (e) => {
        if (e.target === docModal) { docModal.classList.remove('show'); return; }
        const delBtn = e.target.closest('.doc-del-btn');
        if (delBtn) { deleteDocument(delBtn.dataset.id, delBtn.dataset.name); return; }
        const resBtn = e.target.closest('.doc-restore-btn');
        if (resBtn) restoreDocument(resBtn.dataset.id, resBtn.dataset.name);
    });

    async function deleteDocument(id, name) {
        if (!confirm('确定删除文档「' + name + '」及其全部分块吗？（可在回收站恢复）')) return;
        try {
            const resp = await fetch('/documents/' + id, { method: 'DELETE' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            loadDocuments(false);
        } catch (e) {
            alert('删除失败：' + e.message);
        }
    }

    async function restoreDocument(id, name) {
        if (!confirm('确定恢复文档「' + name + '」及其全部分块吗？')) return;
        try {
            const resp = await fetch('/documents/' + id + '/restore', { method: 'POST' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            loadDocuments(true);
        } catch (e) {
            alert('恢复失败：' + e.message);
        }
    }

    async function loadDocuments(deleted) {
        docListBody.innerHTML = '<div class="doc-empty">加载中…</div>';
        try {
            const resp = await fetch(deleted ? '/documents/deleted' : '/documents');
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const docs = await resp.json();
            if (!docs || docs.length === 0) {
                docListBody.innerHTML = '<div class="doc-empty">' + (deleted ? '回收站为空' : '暂无文档，请先上传') + '</div>';
                return;
            }
            const actionBtn = deleted
                ? '<button class="doc-restore-btn" data-id="ID" data-name="NAME">恢复</button>'
                : '<button class="doc-del-btn" data-id="ID" data-name="NAME">删除</button>';
            let html = '<table class="doc-table"><thead><tr>'
                + '<th>名称</th><th>状态</th><th>分块数</th><th>创建时间</th><th></th>'
                + '</tr></thead><tbody>';
            for (const d of docs) {
                const time = d.createTime ? d.createTime.replace('T', ' ').substring(0, 19) : '-';
                html += '<tr>'
                    + '<td>' + escapeHtml(d.name) + '</td>'
                    + '<td><span class="doc-status ' + d.status + '">' + d.status + '</span></td>'
                    + '<td>' + (d.chunkCount ?? 0) + '</td>'
                    + '<td>' + time + '</td>'
                    + '<td>' + actionBtn.replace('ID', d.id).replace('NAME', escapeHtml(d.name)) + '</td>'
                    + '</tr>';
            }
            html += '</tbody></table>';
            docListBody.innerHTML = html;
        } catch (e) {
            docListBody.innerHTML = '<div class="doc-empty">加载失败：' + e.message + '</div>';
        }
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    function setStoppingUi(stopping) {
        sendBtn.classList.toggle('stopping', stopping);
        sendBtn.innerHTML = stopping ? '<span class="stop-mark"></span>终止' : '发送';
    }

    // 用户消息：气泡下方挂「重新发送 / 修改」，列容器保证操作区贴气泡右缘
    function addUserMessage(question) {
        const wrap = document.createElement('div');
        wrap.className = 'msg user';
        const col = document.createElement('div');
        col.className = 'user-col';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = question;
        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        col.appendChild(bubble);
        col.appendChild(actions);
        wrap.appendChild(col);
        messagesEl.appendChild(wrap);
        renderActions(wrap, bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return { wrap, bubble };
    }

    // 重发/修改共用的操作按钮；编辑态结束后也用它恢复
    function renderActions(wrap, bubble) {
        const actions = wrap.querySelector('.msg-actions');
        actions.innerHTML = '';
        const resendBtn = document.createElement('button');
        resendBtn.className = 'msg-btn';
        resendBtn.textContent = '重新发送';
        resendBtn.onclick = () => { if (!busy) runTurn(bubble.textContent, wrap); };
        const editBtn = document.createElement('button');
        editBtn.className = 'msg-btn';
        editBtn.textContent = '修改';
        editBtn.onclick = () => { if (!busy) enterEdit(wrap, bubble); };
        actions.appendChild(resendBtn);
        actions.appendChild(editBtn);
    }

    // 气泡就地变编辑框：发送后原地重生，取消恢复原状
    function enterEdit(wrap, bubble) {
        const actions = wrap.querySelector('.msg-actions');
        const editArea = document.createElement('textarea');
        editArea.className = 'edit-input';
        editArea.value = bubble.textContent;
        bubble.replaceWith(editArea);
        actions.innerHTML = '';
        const okBtn = document.createElement('button');
        okBtn.className = 'msg-btn';
        okBtn.textContent = '发送';
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'msg-btn';
        cancelBtn.textContent = '取消';
        actions.appendChild(okBtn);
        actions.appendChild(cancelBtn);
        editArea.focus();

        function restore() {
            editArea.replaceWith(bubble);
            renderActions(wrap, bubble);
        }
        okBtn.onclick = () => {
            const q = editArea.value.trim();
            if (!q) { restore(); return; }
            bubble.textContent = q;
            editArea.replaceWith(bubble);
            renderActions(wrap, bubble);
            runTurn(q, wrap);
        };
        cancelBtn.onclick = restore;
        editArea.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); okBtn.click(); }
            if (e.key === 'Escape') restore();
        };
    }

    // AI 气泡紧跟用户消息插入：重发历史消息时回答也留在原位，不跑到列表底部
    function addAiBubbleAfter(userWrap) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ai';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        wrap.appendChild(bubble);
        userWrap.after(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
    }

    // 探活并同步常驻提示条：true=知识库可用；网络错误（后端未启动）按可用处理，交给正式请求报错
    async function refreshKbStatus() {
        let ready = true;
        try {
            const resp = await fetch('/health/retrieval');
            const data = await resp.json();
            ready = data.retrievalReady === true;
        } catch (e) {
            ready = true;
        }
        kbStatusEl.style.display = ready ? 'none' : 'block';
        return ready;
    }

    // 页面加载即探活，pg 未启动时立刻给出常驻提示
    refreshKbStatus();
    loadPricing();

    async function loadPricing() {
        try {
            const resp = await fetch('/pricing');
            pricingInfo = await resp.json();
        } catch (e) {
            pricingInfo = null;
        }
    }

    function renderUsage(el, usage) {
        const hit = usage.prompt_cache_hit_tokens || 0;
        const miss = usage.prompt_cache_miss_tokens != null
            ? usage.prompt_cache_miss_tokens
            : Math.max(0, (usage.prompt_tokens || 0) - hit);
        const completion = usage.completion_tokens || 0;
        let text = '输入 ' + fmt(usage.prompt_tokens) + '（缓存命中 ' + fmt(hit) + '）'
            + ' · 输出 ' + fmt(completion)
            + ' · 合计 ' + fmt(usage.total_tokens) + ' tokens';

        if (pricingInfo && pricingInfo.enabled) {
            const p = pricingInfo.prices;
            const cost = (hit * p.cacheHit + miss * p.cacheMiss + completion * p.output) / 1e6;
            const periodText = pricingInfo.period === 'PEAK'
                ? '高峰全价'
                : '闲时 ' + (pricingInfo.rate * 10) + ' 折';
            text += ' · ' + periodText + ' · 约 ¥' + cost.toFixed(6);
        }
        el.textContent = text;
    }

    function fmt(n) {
        return (n == null ? 0 : n).toLocaleString('zh-CN');
    }

    function addDegradedBanner(bubble, reason) {
        const banner = document.createElement('div');
        banner.className = 'degraded-banner';
        banner.textContent = reason || '知识库暂时不可用，以下回答未基于资料';
        bubble.prepend(banner);
    }

    // 来源面板挂在 meta 之前：sources 事件先于正文到达，直接 append 会排到正文下面
    function renderSources(bubble, meta, sources) {
        if (!sources || !sources.length) return;

        const details = document.createElement('details');
        details.className = 'sources';
        const summary = document.createElement('summary');
        summary.textContent = '来源 (' + sources.length + ')';
        details.appendChild(summary);

        sources.forEach(s => {
            const item = document.createElement('div');
            item.className = 'source-item';
            const head = document.createElement('div');
            head.className = 'source-head';
            head.textContent = '[' + s.index + '] ' + (s.documentName || '未知文档')
                + ' · 第 ' + (Number(s.chunkIndex) + 1) + ' 块';
            const text = document.createElement('div');
            text.className = 'source-text';
            // 正文来自用户上传的文档，按纯文本写入，不解析任何标签
            text.textContent = s.content || '';
            item.appendChild(head);
            item.appendChild(text);
            item.title = '点击展开 / 收起原文';
            item.addEventListener('click', () => item.classList.toggle('expanded'));
            details.appendChild(item);
        });

        bubble.insertBefore(details, meta);
    }

    // 输入框发送：userWrap 传 null，确认通过后再建气泡，取消则输入框内容保留
    async function send() {
        const question = inputEl.value.trim();
        if (!question || busy) return;
        runTurn(question, null);
    }

    // 一个问答回合：新建、重新发送、修改共用。userWrap 决定回答气泡插在哪
    async function runTurn(question, userWrap) {
        if (busy) return;

        const hint = messagesEl.querySelector('.hint');
        if (hint) hint.remove();

        const retrievalReady = await refreshKbStatus();
        let skipRetrieval = false;
        if (retrievalReady) {
            degradedConfirmed = false;
        } else {
            if (!degradedConfirmed) {
                const ok = await confirmModal('本次回答将不基于知识库资料，大模型可能产生幻觉。确认直接使用大模型回答吗？');
                if (!ok) return;
                degradedConfirmed = true;
            }
            skipRetrieval = true;
        }

        // 确认完成后才建消息/丢弃旧回答，避免用户在确认框点取消却已清空原答案
        if (!userWrap) {
            userWrap = addUserMessage(question).wrap;
            inputEl.value = '';
        }
        const oldAi = userWrap.nextElementSibling;
        if (oldAi && oldAi.classList.contains('ai')) oldAi.remove();

        busy = true;
        const abortController = new AbortController();
        currentAbort = abortController;
        setStoppingUi(true);

        const bubble = addAiBubbleAfter(userWrap);
        if (skipRetrieval) {
            addDegradedBanner(bubble);
        }
        const reasoning = document.createElement('details');
        reasoning.className = 'reasoning';
        reasoning.open = true;
        const summary = document.createElement('summary');
        summary.textContent = '思考过程';
        const rText = document.createElement('div');
        rText.className = 'rtext';
        reasoning.appendChild(summary);
        reasoning.appendChild(rText);
        const content = document.createElement('div');
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        bubble.appendChild(reasoning);
        bubble.appendChild(content);
        bubble.appendChild(meta);

        try {
            const resp = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, skipRetrieval }),
                signal: abortController.signal
            });
            if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

            const reader = resp.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let gotContent = false;
            let eventName = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                let idx;
                while ((idx = buffer.indexOf('\n')) >= 0) {
                    let line = buffer.slice(0, idx).trim();
                    buffer = buffer.slice(idx + 1);
                    if (!line) { eventName = ''; continue; }

                    if (line.toLowerCase().startsWith('event:')) {
                        eventName = line.slice(6).trim();
                        continue;
                    }

                    while (line.toLowerCase().startsWith('data:')) {
                        line = line.slice(5).trim();
                    }
                    if (!line) continue;

                    if (line === '[DONE]') {
                        finish();
                        return;
                    }

                    let json;
                    try { json = JSON.parse(line); } catch (e) { continue; }

                    // 命名事件：检索链路中途故障的降级通知，与 token 流协议级分流
                    if (eventName === 'degraded') {
                        addDegradedBanner(bubble, json.reason);
                        eventName = '';
                        continue;
                    }
                    if (eventName === 'sources') {
                        renderSources(bubble, meta, json.sources);
                        eventName = '';
                        continue;
                    }
                    eventName = '';

                    // DeepSeek 在 [DONE] 前的最后一个 chunk 附带 usage，与内容 delta 互斥
                    if (json.usage) {
                        renderUsage(meta, json.usage);
                        continue;
                    }

                    const delta = json.choices && json.choices[0] && json.choices[0].delta;
                    if (!delta) continue;
                    if (delta.reasoning_content) {
                        rText.textContent += delta.reasoning_content;
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                    if (delta.content) {
                        if (!gotContent) { reasoning.open = false; gotContent = true; }
                        content.textContent += delta.content;
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                }
            }
        } catch (err) {
            if (err.name === 'AbortError') {
                // 用户主动终止不是故障：保留已生成内容，追加灰色停止标记
                content.textContent += (content.textContent ? '\n' : '') + '（已停止）';
                content.style.color = '#9ca3af';
            } else {
                content.textContent = '请求失败：' + err.message + '（请确认后端已启动且大模型服务可访问）';
                content.style.color = '#dc2626';
            }
        } finally {
            finish();
        }

        function finish() {
            busy = false;
            currentAbort = null;
            setStoppingUi(false);
            inputEl.focus();
        }
    }
</script>
