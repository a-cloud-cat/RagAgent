<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f4f5f7;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #2563eb;
            color: #fff;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,.12);
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg { display: flex; max-width: 80%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .bubble {
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
        .msg.ai .bubble { background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 2px; }
        details.reasoning {
            margin-bottom: 8px;
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            padding: 6px 10px;
        }
        details.reasoning summary {
            cursor: pointer;
            color: #6b7280;
            font-size: 13px;
            user-select: none;
        }
        details.reasoning .rtext {
            margin-top: 6px;
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .cursor { display: inline-block; width: 7px; height: 15px; background: #2563eb; animation: blink 1s steps(1) infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
        #input-bar {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }
        #question {
            flex: 1;
            resize: none;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            height: 44px;
            max-height: 140px;
            outline: none;
        }
        #question:focus { border-color: #2563eb; }
        #send {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 15px;
            cursor: pointer;
            height: 44px;
        }
        #send:disabled { background: #9ca3af; cursor: not-allowed; }
        .hint { text-align: center; color: #9ca3af; font-size: 13px; margin-top: 30px; }
    </style>
</head>
<body>
<header>RAG 智能助手</header>
<div id="messages">
    <div class="hint">在下方输入问题开始对话（接口 POST /chat，SSE 流式返回）</div>
</div>
<div id="input-bar">
    <textarea id="question" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('question');
    const sendBtn = document.getElementById('send');
    let busy = false;

    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });
    sendBtn.addEventListener('click', send);

    function addBubble(role) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
    }

    async function send() {
        const question = inputEl.value.trim();
        if (!question || busy) return;
        busy = true;
        sendBtn.disabled = true;

        const hint = messagesEl.querySelector('.hint');
        if (hint) hint.remove();

        addBubble('user').textContent = question;
        inputEl.value = '';

        const bubble = addBubble('ai');
        const reasoning = document.createElement('details');
        reasoning.className = 'reasoning';
        reasoning.open = true;
        const summary = document.createElement('summary');
        summary.textContent = '思考过程';
        const rText = document.createElement('div');
        rText.className = 'rtext';
        reasoning.appendChild(summary);
        reasoning.appendChild(rText);
        const content = document.createElement('div');
        bubble.appendChild(reasoning);
        bubble.appendChild(content);

        try {
            const resp = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

            const reader = resp.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let gotContent = false;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                let idx;
                while ((idx = buffer.indexOf('\n')) >= 0) {
                    let line = buffer.slice(0, idx).trim();
                    buffer = buffer.slice(idx + 1);
                    if (!line) continue;

                    while (line.toLowerCase().startsWith('data:')) {
                        line = line.slice(5).trim();
                    }
                    if (!line) continue;
                    if (line === '[DONE]') {
                        finish();
                        return;
                    }
                    let json;
                    try { json = JSON.parse(line); } catch (e) { continue; }

                    const delta = json.choices && json.choices[0] && json.choices[0].delta;
                    if (!delta) continue;
                    if (delta.reasoning_content) {
                        rText.textContent += delta.reasoning_content;
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                    if (delta.content) {
                        if (!gotContent) { reasoning.open = false; gotContent = true; }
                        content.textContent += delta.content;
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                }
            }
        } catch (err) {
            content.textContent = '请求失败：' + err.message + '（请确认后端已启动且 LM Studio 在 1234 端口运行）';
            content.style.color = '#dc2626';
        } finally {
            finish();
        }

        function finish() {
            busy = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }
</script>
</body>
</html>
